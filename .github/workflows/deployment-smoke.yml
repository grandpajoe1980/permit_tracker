name: Production deployment smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm run check:deployment -- https://permit-tracker-iota.vercel.app
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          SMOKE_ATTEMPTS: '60'
          SMOKE_RETRY_MS: '10000'
